services:
  legacy-db:
    image: postgres:16
    environment:
      POSTGRES_DB: LegacySwiftParcelDb
      POSTGRES_USER: legacydb
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - legacy_data:/var/lib/postgresql/data
      - ./localenv/init.sql:/docker-entrypoint-initdb.d
  
  swiftparcel-db:
    image: postgres:16
    environment:
        POSTGRES_DB: SwiftParcelDb
        POSTGRES_USER: swiftparceldb
        POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - swiftparcel_data:/var/lib/postgresql/data

  backoffice-api:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_DEVELOPMENT=Development
      - ConnectionStrings__Default=Host=legacy-db;Database=LegacyDb;Username=legacydb;Password=password
      - ConnectionStrings__Default=Host=swiftparcel-db;Database=SwiftParcelDb;Username=swiftparceldb;Password=password
    depends_on:
      legacy-db:
        condition: service_healthy
      swiftparcel-db:
        condition: service_healthy
        
volumes:
    legacy_data:
    swiftparcel_data: